# The Supabase free plan pauses a project after about a week without activity, and lab
# games often go unplayed for longer. A cheap read every few days keeps the shared
# game-lab project awake.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL              https://<ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the same public key the games ship in their bundles
#
# Note: GitHub disables scheduled workflows after 60 days without commits to this repo;
# re-enable it from the Actions tab if that happens.

name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query a game table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/hextag_games?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"
