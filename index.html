<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Lab</title>
    <style>
      :root {
        --bg: #171717;
        --card: #262626;
        --card-hover: #333333;
        --text: #f5f5f5;
        --muted: #a3a3a3;
        --faint: #737373;
        --accent: #60a5fa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
      h1 { font-size: 2.5rem; margin: 0 0 8px; letter-spacing: -0.02em; }
      .intro { color: var(--muted); margin: 0 0 32px; line-height: 1.5; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
      .game {
        display: block;
        padding: 20px;
        border-radius: 12px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
        transition: background 0.15s;
      }
      .game:hover, .game:focus-visible { background: var(--card-hover); }
      .game h2 { margin: 0 0 6px; font-size: 1.25rem; }
      .game p { margin: 0; color: var(--muted); line-height: 1.5; }
      .source { display: inline-block; margin-top: 8px; font-size: 0.85rem; color: var(--accent); }
      .status { color: var(--faint); }
    </style>
  </head>
  <body>
    <main>
      <h1>Game Lab</h1>
      <p class="intro">Prototypes for playtesting with friends. Each game lives in its own repository.</p>
      <ul id="games"><li class="status">Loading games…</li></ul>
    </main>

    <script>
      const list = document.getElementById('games')

      function renderGame(game) {
        const item = document.createElement('li')
        const link = document.createElement('a')
        link.className = 'game'
        link.href = game.url

        const title = document.createElement('h2')
        title.textContent = game.title
        const description = document.createElement('p')
        description.textContent = game.description
        link.append(title, description)

        const source = document.createElement('a')
        source.className = 'source'
        source.href = game.repo
        source.textContent = 'Source'

        item.append(link, source)
        return item
      }

      fetch('games.json')
        .then(response => {
          if (!response.ok) throw new Error(`games.json returned HTTP ${response.status}`)
          return response.json()
        })
        .then(games => list.replaceChildren(...games.map(renderGame)))
        .catch(error => {
          console.error('Failed to load the game list', error)
          list.innerHTML = '<li class="status">Could not load the game list. Try reloading.</li>'
        })
    </script>
  </body>
</html>
